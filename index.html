<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kasir Risol</title>

<style>

body{
  font-family:Arial;
  background:#f5f5f5;
  padding:20px;
}

.container{
  max-width:400px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:15px;
}

select,input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  box-sizing:border-box;
}

button{
  border:none;
  color:white;
  background:green;
  cursor:pointer;
}

#total{
  margin-top:20px;
}

li{
  background:#eee;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  list-style:none;
}

ul{
  padding:0;
}

</style>
</head>

<body>

<div class="container">

<h1>Kasir Risol</h1>

<select id="menu">
  <option>Risol Mayo</option>
  <option>Risol Coklat</option>
  <option>Risol Mentai</option>
  <option>Risol Matcha</option>
</select>

<input type="number" id="jumlah" placeholder="Jumlah">

<button onclick="simpanData()">
Simpan Penjualan
</button>

<h2 id="total">Rp0</h2>

<h3>Riwayat Penjualan</h3>

<ul id="riwayat"></ul>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyCPyIkdTZVPBonxCjPDtHo5JeDVqtjfUTE",
  authDomain: "risol-app.firebaseapp.com",
  projectId: "risol-app",
  storageBucket: "risol-app.firebasestorage.app",
  messagingSenderId: "710080225252",
  appId: "1:710080225252:web:0f385760c1dac26d4731f1"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

window.simpanData = async function(){

  const menu = document.getElementById("menu").value;

  const jumlah = parseInt(
    document.getElementById("jumlah").value
  );

  if(!jumlah || jumlah <= 0){
    alert("Masukkan jumlah dulu");
    return;
  }

  let total = 0;

  // RISOL MAYO
  if(menu === "Risol Mayo"){

    if(jumlah >= 3){

      total = Math.floor(jumlah / 3) * 10000;

      total += (jumlah % 3) * 3500;

    }else{

      total = jumlah * 3500;

    }

  }

  // SELAIN MAYO
  else{

    total = jumlah * 4000;

  }

  document.getElementById("total").innerText =
    "Rp" + total.toLocaleString("id-ID");

  const now = new Date();

  await addDoc(collection(db,"penjualan"),{

    menu: menu,
    jumlah: jumlah,
    total: total,
    tanggal: now.toLocaleDateString("id-ID"),
    jam: now.toLocaleTimeString("id-ID")

  });

  alert("Berhasil disimpan");

};

onSnapshot(collection(db,"penjualan"),(snapshot)=>{

  let html = "";

  snapshot.forEach((doc)=>{

    const data = doc.data();

    html += `
      <li>

        <b>${data.menu}</b><br>

        ${data.jumlah} pcs<br>

        Rp${Number(data.total).toLocaleString("id-ID")}<br><br>

        📅 ${data.tanggal || "-"}<br>

        🕒 ${data.jam || "-"}

      </li>
    `;

  });

  document.getElementById("riwayat").innerHTML = html;

});

</script>

</body>
</html>
