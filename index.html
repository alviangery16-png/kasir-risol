<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Risol</title>

  <style>

    body{
      font-family: Arial, sans-serif;
      background:#f5f5f5;
      margin:0;
      padding:20px;
    }

    .container{
      max-width:400px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:15px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h1{
      text-align:center;
    }

    label{
      display:block;
      margin-top:15px;
      margin-bottom:5px;
      font-weight:bold;
    }

    select,
    input{
      width:100%;
      padding:10px;
      border-radius:10px;
      border:1px solid #ccc;
      box-sizing:border-box;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      margin-top:15px;
      font-size:16px;
      cursor:pointer;
    }

    .hitung{
      background:#ff9800;
      color:white;
    }

    .save{
      background:#4caf50;
      color:white;
    }

    .hasil{
      text-align:center;
      margin-top:20px;
      font-size:24px;
      font-weight:bold;
    }

    ul{
      padding:0;
      list-style:none;
    }

    li{
      background:#f1f1f1;
      padding:10px;
      border-radius:10px;
      margin-top:10px;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>KASIR RISOL</h1>

  <label>Pilih Menu</label>

  <select id="menu">
    <option>Risol Mayo</option>
    <option>Risol Coklat</option>
    <option>Risol Mentai</option>
    <option>Risol Matcha</option>
  </select>

  <label>Jumlah</label>

  <input type="number" id="jumlah" placeholder="Masukkan jumlah">

  <button class="hitung" onclick="hitungTotal()">
    Hitung Total
  </button>

  <div class="hasil">
    <h2 id="total">Rp0</h2>
  </div>

  <button class="save" onclick="simpanData()">
    Simpan Penjualan
  </button>

  <h3>Riwayat Penjualan</h3>

  <ul id="riwayat"></ul>

</div>

<script>

function hitungTotal(){

  const menu = document.getElementById("menu").value;

  const jumlah = parseInt(
    document.getElementById("jumlah").value
  );

  let total = 0;

  // RISOL MAYO
  if(menu === "Risol Mayo"){

    if(jumlah >= 3){

      total = Math.floor(jumlah / 3) * 10000;

      const sisa = jumlah % 3;

      total += sisa * 3500;

    }else{

      total = jumlah * 3500;

    }

  }

  // RISOL COKLAT
  if(menu === "Risol Coklat"){
    total = jumlah * 4000;
  }

  // RISOL MENTAI
  if(menu === "Risol Mentai"){
    total = jumlah * 4000;
  }

  // RISOL MATCHA
  if(menu === "Risol Matcha"){
    total = jumlah * 4000;
  }

  document.getElementById("total").innerText =
    "Rp" + total.toLocaleString("id-ID");

}

</script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  query,
  orderBy
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyCPyIkdTZVPBonxCjPDtHo5JeDVqtjfUTE",
  authDomain: "risol-app.firebaseapp.com",
  projectId: "risol-app",
  storageBucket: "risol-app.firebasestorage.app",
  messagingSenderId: "710080225252",
  appId: "1:710080225252:web:0f385760c1dac26d4731f1",
  measurementId: "G-8QKKDJK2Q3"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

window.simpanData = async function(){

  const menu = document.getElementById("menu").value;

  const jumlah = parseInt(
    document.getElementById("jumlah").value
  );

  let total = 0;

  // RISOL MAYO
  if(menu === "Risol Mayo"){

    if(jumlah >= 3){

      total = Math.floor(jumlah / 3) * 10000;

      const sisa = jumlah % 3;

      total += sisa * 3500;

    }else{

      total = jumlah * 3500;

    }

  }

  // RISOL COKLAT
  if(menu === "Risol Coklat"){
    total = jumlah * 4000;
  }

  // RISOL MENTAI
  if(menu === "Risol Mentai"){
    total = jumlah * 4000;
  }

  // RISOL MATCHA
  if(menu === "Risol Matcha"){
    total = jumlah * 4000;
  }

  await addDoc(collection(db, "penjualan"), {

    menu: menu,
    jumlah: jumlah,
    total: total,
    waktu: new Date()

  });

  alert("Penjualan berhasil disimpan!");

};

const q = query(
  collection(db, "penjualan"),
  orderBy("waktu", "desc")
);

onSnapshot(q, (snapshot) => {

  let html = "";

  snapshot.forEach((doc) => {

    const data = doc.data();

    html += `
      <li>
        <b>${data.menu}</b><br>
        ${data.jumlah} pcs<br>
        Rp${data.total.toLocaleString("id-ID")}
      </li>
    `;

  });

  document.getElementById("riwayat").innerHTML = html;

});

</script>

</body>
</html>
